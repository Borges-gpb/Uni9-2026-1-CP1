<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Estrutura Semântica</title>
</head>
<body>
    <header>
        <h1>Meu Site</h1>
    </header>

    <main>
        <!-- Section: Agrupa conteúdos relacionados -->
        <section id="ultimas-noticias">
            <h2>Últimas Notícias</h2>

            <!-- Article: Conteúdo independente -->
            <article>
                <h3>Título da Notícia 1</h3>
                <p>Conteúdo da notícia...</p>
            </article>

            <article>
                <h3>Título da Notícia 2</h3>
                <p>Conteúdo da notícia...</p>
            </article>
        </section>

        <!-- Outra section para um conteúdo diferente -->
        <section id="produtos">
            <h2>Produtos</h2>
            <article>
                <h3>Produto A</h3>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>
</body>
</html>
